<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0A0A0C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="https://waiterwalk.com/wp-content/uploads/2018/05/Waiter-walk-Final-logo-298x300-1.png" />
    <title>Waiter Walk</title>
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a polyfill (like formdata-polyfill or cross-fetch) tries to overwrite window.fetch
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (v) => { console.warn('Intercepted attempt to overwrite window.fetch'); }
        });
      } catch (e) {
        console.error('Failed to configure fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
