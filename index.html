<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiter Walk</title>
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when a polyfill (like formdata-polyfill or cross-fetch) tries to overwrite window.fetch
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (v) => { console.warn('Intercepted attempt to overwrite window.fetch'); }
        });
      } catch (e) {
        console.error('Failed to configure fetch:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
